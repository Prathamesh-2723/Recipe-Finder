<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Finder</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
    <div class="app">


        <header class="app-header">
            <div class="brand">
                <span class="brand-mark"></span>
                <h1>CookSync</h1>
            </div>
            <p class="tagline"> Cook with what you already have.</p>

            <div class="search-bar">
                <input type="text" id="recipe-search" placeholder="Search recipes, e.g. fried momos"
                autocomplete="off">
            </div>
        </header>

        <div class="app-main">

            <section class="ingredient-panel" aria-labelledby="ingredient-heading">
                <h2 id="ingredient-heading">Your ingredients</h2>

                <div class="selected-tray" id="selected-tray">
                    <p class="empty-hint" id="selected-empty-hint">No ingredients selected yet . Add a few below to get started .</p>
                </div>

                <button class="clear-btn" id="clear-ingredients-btn" type="button">Clear all
                </button>

                <div class="ingredient-search">
                    <input type="text" id="ingredient-filter" placeholder="Find an ingredient" autocomplete="off">
                </div>

                <div class="ingredient-list" id="ingredient-list">
                    <button class="chip" type="button" data-ingredient="chicken">Chicken</button>
                    <button class="chip" type="button" data-ingredient="garlic">Garlic</button>
                    <button class="chip" type="button" data-ingredient="rice">Rice</button>
                    <button class="chip" type="button" data-ingredient="tomato">Tomato</button>
                    <button class="chip" type="button" data-ingredient="onion">Onion</button>
                    <button class="chip" type="button" data-ingredient="cheese">Cheese</button>
                    <button class="chip" type="button" data-ingredient="spinach">Spinach</button>
                    <button class="chip" type="button" data-ingredient="egg">Egg</button>
                    <button class="chip" type="button" data-ingredient="potato">Potato</button>
                    <button class="chip" type="button" data-ingredient="pasta">Pasta</button>
                    <button class="chip" type="button" data-ingredient="lemon">Lemon</button>
                    <button class="chip" type="button" data-ingredient="beans">Beans</button>
                </div>          
            </section>
        </div>

        <div class="model-overlay" id="recipe-model" hidden>
            <div class="model" role="dialog" aria-modal="true">

            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
